[graph]
targets = []
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  # Transitive dep via google-cloud-auth; no safe upgrade available.
  # See https://rustsec.org/advisories/RUSTSEC-2025-0134
  "RUSTSEC-2025-0134",
  # aws-lc-sys 0.38.0 (transitive via google-cloud-auth -> aws-lc-rs); pinned
  # by aws-lc-rs, no compatible upgrade to a patched (>=0.39) release yet.
  "RUSTSEC-2026-0044",
  "RUSTSEC-2026-0048",
  # quick-xml 0.38.4 (transitive via arboard -> wl-clipboard-rs ->
  # wayland-scanner); wayland-scanner pins <0.41, so no patched upgrade yet.
  # Only reachable through Wayland clipboard parsing, not attacker-controlled.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
allow = [
  "MIT",
  "BSL-1.0",
  "BSD-3-Clause",
  "Apache-2.0",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "ISC",
  "CDLA-Permissive-2.0",
  # `edit` (external editor launcher) is public-domain dedicated.
  "CC0-1.0",
  # aws-lc-sys bundles BoringSSL/OpenSSL-derived code (transitive via
  # google-cloud-auth -> aws-lc-rs); the OpenSSL license is permissive.
  "OpenSSL",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
