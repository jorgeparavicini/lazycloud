[package]
name = "lazycloud"
version = "0.1.5"
description = "A terminal UI for various cloud provider CLIs"
authors = ["Jorge Paravicini"]
edition = "2024"
license = "MIT"
repository = "https://github.com/jorgeparavicini/lazycloud"
keywords = ["tui", "cloud", "gcp", "terminal", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"
resolver = "3"
homepage = "https://github.com/jorgeparavicini/lazycloud"

[dependencies]
color-eyre = "0.6.5"
ratatui = { version = "0.30.0", features = ["unstable-widget-ref"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
futures = "0.3.31"
signal-hook = "0.4.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serini = "0.2.2"
google-cloud-secretmanager-v1 = "1.2.0"
google-cloud-auth = "1.3.0"
google-cloud-wkt = "1.2.0"
google-cloud-gax = "1"
google-cloud-api-serviceusage-v1 = "1"
google-cloud-lro = "1"
google-cloud-storage = "1.9.0"
thiserror = "2"
throbber-widgets-tui = "0.10.0"
async-trait = "0.1.89"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
chrono = "0.4"
catppuccin = "2.4"
dirs = "6.0"
edit = "0.1.5"
fuzzy-matcher = "0.3"
toml = "0.9.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
warnings = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -3 }
