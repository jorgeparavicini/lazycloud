[package]
name = "lazycloud"
version = "0.1.1"
description = "A terminal UI for various cloud provider CLIs"
authors = ["Jorge Paravicini"]
edition = "2024"
license = "MIT"
repository = "https://github.com/jorgeparavicini/lazycloud"
keywords = ["tui", "cloud", "gcp", "terminal", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"
resolver = "3"
homepage = "https://github.com/jorgeparavicini/lazycloud"

[dependencies]
color-eyre = "0.6.5"
ratatui = { version = "0.30.0", features = ["unstable-widget-ref"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
futures = "0.3.31"
signal-hook = "0.4.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serini = "0.2.2"
google-cloud-secretmanager-v1 = "1.2.0"
google-cloud-auth = "1.3.0"
google-cloud-wkt = "1.2.0"
throbber-widgets-tui = "0.10.0"
async-trait = "0.1.89"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
chrono = "0.4"
catppuccin = "2.4"
dirs = "6.0"
fuzzy-matcher = "0.3"
toml = "0.9.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# Whether dist should create a Github Release or use an existing draft
create-release = false
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# CI backends to support
ci = "github"
# Whether to auto-include files like READMEs, LICENSEs, and CHANGELOGs (default true)
auto-includes = true
# A GitHub repo to push Homebrew formulas to
tap = "jorgeparavicini/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
warnings = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -3 }
